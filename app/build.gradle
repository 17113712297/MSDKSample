plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.example.msdksample'
    compileSdk 35// 编译版本可以留高一点，兼容新语法

    defaultConfig {
        applicationId "com.example.msdksample"
        minSdk 24
        targetSdk 35 //
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['*/*/libconstants.so', '*/*/libdji_innertools.so', '*/*/libdjibase.so', '*/*/libDJICSDKCommon.so', '*/*/libDJIFlySafeCore-CSDK.so', '*/*/libdjifs_jni-CSDK.so', '*/*/libDJIRegister.so', '*/*/libdjisdk_jni.so', '*/*/libDJIUpgradeCore.so', '*/*/libDJIUpgradeJNI.so', '*/*/libDJIWaypointV2Core-CSDK.so', '*/*/libdjiwpv2-CSDK.so', '*/*/libFlightRecordEngine.so', '*/*/libvideo-framing.so', '*/*/libwaes.so', '*/*/libagora-rtsa-sdk.so', '*/*/libc++.so', '*/*/libc++_shared.so', '*/*/libmrtc_28181.so', '*/*/libmrtc_agora.so', '*/*/libmrtc_core.so', '*/*/libmrtc_core_jni.so', '*/*/libmrtc_data.so', '*/*/libmrtc_log.so', '*/*/libmrtc_onvif.so', '*/*/libmrtc_rtmp.so', '*/*/libmrtc_rtsp.so']
            pickFirsts += ['lib/arm64-v8a/libc++_shared.so', 'lib/armeabi-v7a/libc++_shared.so']
        }

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation project(":android-sdk-v5-uxsdk")
    implementation 'com.dji:dji-sdk-v5-aircraft:5.17.0'
    compileOnly 'com.dji:dji-sdk-v5-aircraft-provided:5.17.0'

    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation project(':opencv')
}
