listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

rtc_server {
    enabled         on;
    listen          8000;
    candidate       127.0.0.1;
}

vhost __defaultVhost__ {
    min_latency     on;

    play {
        gop_cache   off;
        queue_length 1;
        mw_latency 100;
    }

    publish {
        mr          off;
    }

    hls {
        enabled     off;
    }

    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp off;
        nack        on;
        twcc        on;
    }
}
